name: Uptime

# Liveness of the web app and the API, database readiness, robots.txt, the rendered home page and
# its portfolio notice (infra/scripts/smoke-test.mts). Every check is tried up to three times,
# 10 seconds apart, so a single slow response is not an outage.
#
# Nothing is hosted yet, so the 15-minute schedule is off: every run would only print a notice.
# After the first deploy, set the UPTIME_WEB_URL and UPTIME_API_URL repository variables and
# uncomment the schedule. A failed scheduled run is the alert: GitHub emails whoever last changed
# the schedule. GitHub pauses scheduled workflows after 60 days without repository activity.
# A manual run without the variables skips with a notice.

on:
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    name: Uptime check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEB_URL: ${{ vars.UPTIME_WEB_URL }}
      API_URL: ${{ vars.UPTIME_API_URL }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -n "$WEB_URL" ] && [ -n "$API_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Uptime check skipped: set the UPTIME_WEB_URL and UPTIME_API_URL repository variables."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.config.outputs.configured == 'true'
        with:
          sparse-checkout: infra/scripts

      - uses: actions/setup-node@v7
        if: steps.config.outputs.configured == 'true'
        with:
          node-version: 24

      - name: Check the public endpoints
        if: steps.config.outputs.configured == 'true'
        run: node infra/scripts/smoke-test.mts --web "$WEB_URL" --api "$API_URL" --attempts 3 --delay-ms 10000
