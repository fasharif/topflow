name: Publish test report

# Publishes the Playwright HTML report of the latest system-test run on develop to GitHub Pages,
# whether the run passed or failed. Pull-request runs are never published. A run that failed before
# Playwright wrote a report (for example while starting the stack) has nothing to publish: the job
# then says so and ends without failing, so it does not add a second red workflow to the first.
#
# One-time setup by the repository owner: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". Until Pages is enabled this workflow fails at the deploy step.

on:
  workflow_run:
    workflows: [System tests]
    types: [completed]
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the Playwright report
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Look for the Playwright report of that run
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?name=playwright-report" --jq '.total_count')"
          if [[ "$count" == 0 ]]; then
            echo "::notice::System tests run $RUN_ID uploaded no Playwright report; nothing to publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.report.outputs.found == 'true'
        uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - if: steps.report.outputs.found == 'true'
        uses: actions/configure-pages@v6

      - if: steps.report.outputs.found == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - if: steps.report.outputs.found == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
