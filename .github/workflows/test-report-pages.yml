name: Publish test report

# Publishes the Playwright HTML report of the latest system-test run on develop to GitHub Pages,
# whether the run passed or failed. Pull-request runs are never published.
#
# The first job decides whether there is anything to publish, and ends green either way:
# - a run that failed before Playwright wrote a report (for example while starting the stack) has
#   nothing to publish, so this workflow does not add a second red run to the first;
# - until the repository owner enables Pages (Settings → Pages → Build and deployment → Source:
#   "GitHub Actions"), there is nowhere to publish to. The job then says so in a notice, the
#   publish job is skipped, and the report stays an artifact of the system-test run.

on:
  workflow_run:
    workflows: [System tests]
    types: [completed]
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Is there a report, and is Pages enabled?
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pages: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Look for the Playwright report of that run and for the Pages site
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?name=playwright-report" --jq '.total_count')"
          if [[ "$count" == 0 ]]; then
            echo "::notice::System tests run $RUN_ID uploaded no Playwright report; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The Pages site exists only once Pages is enabled; gh exits with an error on the 404.
          if build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2> "$RUNNER_TEMP/pages.err")"; then
            if [[ "$build_type" == workflow ]]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::GitHub Pages is not set to build from GitHub Actions (build type: $build_type); the report is not published."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/pages.err"; then
            echo "::notice::GitHub Pages is not enabled for this repository; the Playwright report stays an artifact of System tests run $RUN_ID."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not read the repository's Pages settings ($(tr '\n' ' ' < "$RUNNER_TEMP/pages.err")); the report is not published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish the Playwright report
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
