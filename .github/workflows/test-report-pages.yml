name: Publish test report

# Publishes the Playwright HTML report of the latest system-test run on develop to GitHub Pages,
# whether the run passed or failed. Pull-request runs are never published.
#
# One-time setup by the repository owner: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". Until Pages is enabled this workflow fails at the deploy step.

on:
  workflow_run:
    workflows: [System tests]
    types: [completed]
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the Playwright report
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
