name: CI

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint · typecheck · unit tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build shared packages (contracts + Prisma client)
        run: npx turbo run build --filter=@topflow/shared --filter=@topflow/database

      - name: Shared contracts — unit tests
        run: npm test -w @topflow/shared

      - name: API — lint, typecheck, unit tests, build
        run: |
          npm run lint -w @topflow/api
          npm run check-types -w @topflow/api
          npm test -w @topflow/api
          npm run build -w @topflow/api

      - name: Web — lint, typecheck and production build
        run: |
          npm run lint -w web
          npm run check-types -w web
          npm run build -w web
        env:
          API_INTERNAL_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3002
          # Placeholders: the build never contacts Supabase.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

      - name: Mobile — typecheck
        run: npx tsc --noEmit -p apps/mobile

  e2e:
    name: API end-to-end tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: topflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/topflow_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build shared packages
        run: npx turbo run build --filter=@topflow/shared --filter=@topflow/database

      - name: Apply migrations and seed
        run: |
          npm run db:deploy
          npm run db:seed

      # Supabase Auth is simulated inside the suite (locally signed test tokens), so no network is needed.
      - name: Run end-to-end suite
        run: npm run test:e2e -w @topflow/api
