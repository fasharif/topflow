name: CI

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint · typecheck · unit tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build shared packages (contracts + Prisma client)
        run: npx turbo run build --filter=@topflow/shared --filter=@topflow/database

      - name: Shared contracts — unit tests
        run: npm test -w @topflow/shared

      - name: Local setup script — typecheck and unit tests
        run: npm run test:scripts

      - name: Database scripts — typecheck and unit tests (demo reset safety checks)
        run: |
          npm run check-types -w @topflow/database
          npm test -w @topflow/database

      - name: API — lint, typecheck, unit tests with coverage, build
        run: |
          npm run lint -w @topflow/api
          npm run check-types -w @topflow/api
          npm run test:cov -w @topflow/api
          npm run build -w @topflow/api

      - name: API — unit test coverage summary
        run: node apps/api/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: api-coverage-unit
          path: apps/api/coverage/unit
          retention-days: 14

      # The smoke test starts the production build and checks, over HTTP, that an ordinary build carries
      # no demo banner, noindex or demo notices.
      - name: Web — lint, typecheck, unit tests, production build and smoke test
        run: |
          npm run lint -w web
          npm run check-types -w web
          npm test -w web
          npm run build -w web
          npm run test:demo -w web -- --off
        env:
          API_INTERNAL_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3002
          # Placeholders: neither the build nor the smoke test contacts Supabase.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

      # The public demo's build: the banner and noindex on every page checked, robots.txt disallowing
      # everything, the sign-up and reset notices, and no password form without a session.
      - name: Web — demo build and smoke test
        run: |
          npm run build -w web
          npm run test:demo -w web
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
          API_INTERNAL_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3002
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

      - name: Mobile — typecheck and unit tests
        run: |
          npx tsc --noEmit -p apps/mobile
          npm test -w mobile

      # The suites themselves run in system-tests.yml against the whole stack.
      - name: System tests — lint, typecheck and shellcheck
        run: |
          npm run lint -w @topflow/system-tests
          npm run check-types -w @topflow/system-tests
          shellcheck -x tests/load/run-k6.sh tests/contract/run-schemathesis.sh tests/scripts/*.sh

  e2e:
    name: API end-to-end tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: topflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/topflow_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build shared packages
        run: npx turbo run build --filter=@topflow/shared --filter=@topflow/database

      - name: Apply migrations and seed
        run: |
          npm run db:deploy
          npm run db:seed

      # Runs the nightly demo reset for real: every table is emptied and seeded again, and the
      # suites below then run against the result.
      - name: Reset the demo data set
        run: npm run demo:reset -- --confirm
        env:
          DEMO_MODE: "true"

      # Supabase Auth is simulated inside the suite (locally signed test tokens), so no network is needed.
      - name: Run end-to-end suite with coverage
        run: npm run test:e2e:cov -w @topflow/api

      - name: End-to-end coverage summary
        run: node apps/api/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: api-coverage-e2e
          path: apps/api/coverage/e2e
          retention-days: 14
