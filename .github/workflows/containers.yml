name: Containers

# Builds the three images (api, migrate, web), fails on critical vulnerabilities (Trivy), starts
# the production-like Compose stack with them and runs the smoke test, including a real sign-in
# through Supabase Auth. Pushes to develop then publish exactly those images to GHCR (the same
# image IDs, never a rebuild), tagged sha-<commit> and develop, with a signed build provenance
# attestation and an SBOM attestation per image. .github/workflows/deploy.yml verifies the
# provenance and deploys by digest.

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop]

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0

jobs:
  images:
    name: Build · scan · Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      api_id: ${{ steps.ids.outputs.api }}
      migrate_id: ${{ steps.ids.outputs.migrate }}
      web_id: ${{ steps.ids.outputs.web }}
    steps:
      - uses: actions/checkout@v7

      - name: Image tag
        id: version
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: api
          build-args: APP_VERSION=${{ steps.version.outputs.tag }}
          tags: topflow-hub-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          build-args: APP_VERSION=${{ steps.version.outputs.tag }}
          tags: topflow-hub-migrate:ci
          load: true
          cache-from: |
            type=gha,scope=api
            type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

      - name: Build web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: APP_VERSION=${{ steps.version.outputs.tag }}
          tags: topflow-hub-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # The publish job pushes images with exactly these IDs.
      - name: Record the image IDs
        id: ids
        run: |
          for image in api migrate web; do
            echo "$image=$(docker image inspect --format '{{.Id}}' "topflow-hub-$image:ci")" >> "$GITHUB_OUTPUT"
          done

      # Fails on any critical vulnerability; high ones are listed in the job summary.
      - name: Scan images with Trivy
        run: |
          echo "### Image scan (Trivy, HIGH and CRITICAL)" >> "$GITHUB_STEP_SUMMARY"
          status=0
          for image in api migrate web; do
            docker image ls "topflow-hub-$image:ci" --format "topflow-hub-$image: {{.Size}}" | tee -a "$GITHUB_STEP_SUMMARY"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy \
              "$TRIVY_IMAGE" image --quiet --scanners vuln --severity HIGH,CRITICAL --format table \
              "topflow-hub-$image:ci" | tee -a "$GITHUB_STEP_SUMMARY"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy \
              "$TRIVY_IMAGE" image --quiet --scanners vuln --severity CRITICAL --exit-code 1 --format table \
              "topflow-hub-$image:ci" > /dev/null || { echo "::error::topflow-hub-$image has critical vulnerabilities"; status=1; }
          done
          exit "$status"

      - name: Build the demo seed image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: seed
          tags: topflow-hub-seed:ci
          load: true
          cache-from: type=gha,scope=api

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # A DSN that can never receive events proves both images start with error reporting on.
      - name: Start the production-like stack
        env:
          IMAGE_TAG: ci
          SENTRY_DSN: https://public@sentry.invalid/1
        run: |
          node infra/compose/generate-env.mts
          docker compose -f docker-compose.prod.yml --env-file infra/compose/.env up -d --no-build --wait --wait-timeout 300
          docker compose -f docker-compose.prod.yml --env-file infra/compose/.env --profile demo run --rm seed
          docker compose -f docker-compose.prod.yml --env-file infra/compose/.env cp proxy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt"

      - name: Smoke test
        env:
          SMOKE_PASSWORD: TopFlow2026!
        run: |
          node infra/scripts/smoke-test.mts --web https://localhost:8443 --api https://api.localhost:8443 \
            --auth https://auth.localhost:8443 --ca "$RUNNER_TEMP/caddy-root.crt" \
            --expect-version "${{ steps.version.outputs.tag }}" --sign-in buyer@desertbloom.ae

      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file infra/compose/.env logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file infra/compose/.env --profile demo down -v || true

      # Only on develop, and only after the scan and the smoke test passed: the images that were
      # tested, handed to the publish job (which alone may write packages).
      - name: Save the tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          mkdir -p "$RUNNER_TEMP/tested-images"
          for image in api migrate web; do
            docker save "topflow-hub-$image:ci" | gzip -1 > "$RUNNER_TEMP/tested-images/$image.tar.gz"
          done

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        with:
          name: tested-images
          path: ${{ runner.temp }}/tested-images/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish to GHCR (${{ matrix.image }})
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Signs the attestations with a short-lived Sigstore certificate and stores them.
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: [api, migrate, web]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/topflow-hub-${{ matrix.image }}
      TAG: ${{ needs.images.outputs.tag }}
      TESTED_ID: ${{ needs.images.outputs[format('{0}_id', matrix.image)] }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tested-images
          path: ${{ runner.temp }}/tested-images

      - name: Load the image that was scanned and smoke-tested
        run: |
          docker load --quiet --input "$RUNNER_TEMP/tested-images/${{ matrix.image }}.tar.gz"
          loaded="$(docker image inspect --format '{{.Id}}' "topflow-hub-${{ matrix.image }}:ci")"
          if [ "$loaded" != "$TESTED_ID" ]; then
            echo "::error::Loaded image $loaded, but the images job tested $TESTED_ID."
            exit 1
          fi

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        run: |
          docker tag "topflow-hub-${{ matrix.image }}:ci" "$IMAGE:$TAG"
          docker tag "topflow-hub-${{ matrix.image }}:ci" "$IMAGE:develop"
          docker push --quiet "$IMAGE:$TAG"
          docker push --quiet "$IMAGE:develop"
          digest="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r '.digest // empty')"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not read the pushed digest of $IMAGE:$TAG."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "- \`$IMAGE:$TAG\` = \`$digest\` (image ID \`$TESTED_ID\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP:/out" \
            "$TRIVY_IMAGE" image --quiet --format cyclonedx --output "/out/sbom-${{ matrix.image }}.cdx.json" "$IMAGE:$TAG"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom-${{ matrix.image }}.cdx.json
          push-to-registry: true
          create-storage-record: false
