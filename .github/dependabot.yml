version: 2
updates:
  # npm workspaces share the root package-lock.json, so one entry covers every app and package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Tool images for the system tests (k6, Schemathesis, ffmpeg), pinned in tests/compose.yaml.
  - package-ecosystem: docker-compose
    directory: /tests
    schedule:
      interval: weekly
