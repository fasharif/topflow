version: 2
updates:
  # npm workspaces share the root package-lock.json, so one entry covers every app and package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Each Expo SDK pins React, React Native and their native libraries for the mobile app.
    # Dependabot moved them past SDK 57 in #8 and broke the mobile build, so they are upgraded
    # together with the SDK instead (npx expo install --fix in apps/mobile). The web app's React
    # moves with them.
    ignore:
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: "@expo/*"
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      - dependency-name: react-native
      - dependency-name: react-native-*
      - dependency-name: "@react-native/*"
      # Prisma's CLI and client are pinned together by "overrides" (and their install scripts by
      # "allowScripts") in the root package.json, which Dependabot does not update. Upgrade them by
      # hand, all in one change.
      - dependency-name: prisma
      - dependency-name: "@prisma/*"
      # NestJS 12 is blocked by nestjs-zod, whose latest release (5.5.0) supports @nestjs/common 10-11
      # and @nestjs/swagger up to 11 only. Minor and patch updates still come through; the major
      # upgrade is a deliberate migration once nestjs-zod supports it (or it is replaced).
      - dependency-name: "@nestjs/common"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/platform-express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/testing"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/swagger"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/mapped-types"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Base images of apps/api/Dockerfile and apps/web/Dockerfile (tag and digest). Dependabot reads
  # literal FROM lines only, so each Dockerfile names its base once, in the node-base stage.
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule:
      interval: weekly

  # Images of the production-like stack (docker-compose.prod.yml).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  # The AWS provider of every Terraform root and module (lock files included).
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/bootstrap
      - /infra/terraform/environments/staging
      - /infra/terraform/environments/production
      - /infra/terraform/modules/hub
    schedule:
      interval: weekly
