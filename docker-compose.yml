services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: topflow
      POSTGRES_PASSWORD: topflow_dev_password
      POSTGRES_DB: topflow_db
    ports:
      - "5432:5432"
    volumes:
      - topflow_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  topflow_pg_data: