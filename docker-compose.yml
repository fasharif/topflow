services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://topflow:topflow_dev_password@postgres:5432/topflow_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super-secret-dev-key
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: topflow
      POSTGRES_PASSWORD: topflow_dev_password
      POSTGRES_DB: topflow_db
    ports:
      - "5432:5432"
    volumes:
      - topflow_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  topflow_pg_data: